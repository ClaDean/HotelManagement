<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店智能门锁管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-house-door-fill"></i> 酒店智能门锁管理系统
            </span>
            <span class="text-white">
                <i class="bi bi-person-circle"></i> 管理员
            </span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" data-page="dashboard">
                                <i class="bi bi-speedometer2"></i> 仪表盘
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="rooms">
                                <i class="bi bi-door-closed"></i> 房间管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="locks">
                                <i class="bi bi-key-fill"></i> 门锁管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="bookings">
                                <i class="bi bi-calendar-check"></i> 订单管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="records">
                                <i class="bi bi-clock-history"></i> 开锁记录
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <!-- 仪表盘 -->
                <div id="dashboard-page" class="page-content">
                    <div
                        class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">仪表盘</h1>
                    </div>
                    <div class="row">
                        <div class="col-md-3">
                            <div class="card text-white bg-primary mb-3">
                                <div class="card-body">
                                    <h5 class="card-title">总房间数</h5>
                                    <p class="card-text display-4" id="total-rooms">0</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-white bg-success mb-3">
                                <div class="card-body">
                                    <h5 class="card-title">空闲房间</h5>
                                    <p class="card-text display-4" id="available-rooms">0</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-white bg-warning mb-3">
                                <div class="card-body">
                                    <h5 class="card-title">今日入住</h5>
                                    <p class="card-text display-4" id="today-checkins">0</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-white bg-danger mb-3">
                                <div class="card-body">
                                    <h5 class="card-title">门锁总数</h5>
                                    <p class="card-text display-4" id="total-locks">0</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 房间管理 -->
                <div id="rooms-page" class="page-content" style="display:none;">
                    <div
                        class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">房间管理</h1>
                        <button class="btn btn-primary" onclick="showAddRoomModal()">
                            <i class="bi bi-plus-circle"></i> 添加房间
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>房间号</th>
                                    <th>类型</th>
                                    <th>楼层</th>
                                    <th>状态</th>
                                    <th>价格</th>
                                    <th>门锁</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="rooms-table-body">
                                <!-- 动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 门锁管理 -->
                <div id="locks-page" class="page-content" style="display:none;">
                    <div
                        class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">门锁管理</h1>
                        <button class="btn btn-primary" onclick="showAddLockModal()">
                            <i class="bi bi-plus-circle"></i> 添加门锁
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>设备ID</th>
                                    <th>设备名称</th>
                                    <th>制造商</th>
                                    <th>型号</th>
                                    <th>房间</th>
                                    <th>状态</th>
                                    <th>电量</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="locks-table-body">
                                <!-- 动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 订单管理 -->
                <div id="bookings-page" class="page-content" style="display:none;">
                    <div
                        class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">订单管理</h1>
                        <button class="btn btn-primary" onclick="showAddBookingModal()">
                            <i class="bi bi-plus-circle"></i> 创建订单
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>订单号</th>
                                    <th>房间号</th>
                                    <th>客人</th>
                                    <th>手机</th>
                                    <th>入住时间</th>
                                    <th>退房时间</th>
                                    <th>状态</th>
                                    <th>总价</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="bookings-table-body">
                                <!-- 动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 开锁记录 -->
                <div id="records-page" class="page-content" style="display:none;">
                    <div
                        class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">开锁记录</h1>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>时间</th>
                                    <th>房间</th>
                                    <th>门锁</th>
                                    <th>开锁方式</th>
                                    <th>结果</th>
                                </tr>
                            </thead>
                            <tbody id="records-table-body">
                                <!-- 动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 添加房间模态框 -->
    <div class="modal fade" id="addRoomModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">添加房间</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addRoomForm">
                        <div class="mb-3">
                            <label class="form-label">房间号</label>
                            <input type="text" class="form-control" id="roomNumber" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">房间类型</label>
                            <select class="form-select" id="roomType" required>
                                <option>标准间</option>
                                <option>大床房</option>
                                <option>豪华套房</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">楼层</label>
                            <input type="number" class="form-control" id="floor" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">价格</label>
                            <input type="number" class="form-control" id="price" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">描述</label>
                            <textarea class="form-control" id="description"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="addRoom()">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加门锁模态框 -->
    <div class="modal fade" id="addLockModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">添加门锁</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addLockForm">
                        <div class="mb-3">
                            <label class="form-label">设备ID</label>
                            <input type="text" class="form-control" id="deviceId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">设备名称</label>
                            <input type="text" class="form-control" id="deviceName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">制造商</label>
                            <select class="form-select" id="manufacturer" required>
                                <option>TTLock</option>
                                <option>涂鸦智能</option>
                                <option>小米</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">型号</label>
                            <input type="text" class="form-control" id="model" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">绑定房间</label>
                            <select class="form-select" id="lockRoomId">
                                <option value="">暂不绑定</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="addLock()">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建订单模态框 -->
    <div class="modal fade" id="addBookingModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">创建订单</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addBookingForm">
                        <div class="mb-3">
                            <label class="form-label">选择房间</label>
                            <select class="form-select" id="bookingRoomId" required>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">客人姓名</label>
                            <input type="text" class="form-control" id="guestName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">手机号</label>
                            <input type="tel" class="form-control" id="guestPhone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">身份证号</label>
                            <input type="text" class="form-control" id="guestIdCard">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">入住时间</label>
                            <input type="datetime-local" class="form-control" id="checkInTime" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">退房时间</label>
                            <input type="datetime-local" class="form-control" id="checkOutTime" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">总价</label>
                            <input type="number" class="form-control" id="totalPrice" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="addBooking()">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 查看密码模态框 -->
    <div class="modal fade" id="passwordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">入住成功 - 临时密码</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <h1 class="display-1 text-success my-4" id="tempPassword"></h1>
                    <p class="text-muted">请告知客人此密码用于开锁</p>
                    <p class="text-muted small">有效期至退房后2小时</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
